name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.2.3). Laisser vide pour utiliser la réf du déclenchement."
        required: false
        type: string
      target:
        description: "Branche à tagguer si le tag n'existe pas encore (créé par la release)."
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publier la release Android
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Vérifier la présence du keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : une release doit toujours être signée avec le même keystore (voir README)."
          exit 1

      - name: Résoudre le tag à publier
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Se placer sur le tag (ou la branche cible si le tag reste à créer)
        id: ref
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ inputs.target || 'main' }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          else
            git fetch -q origin "$TARGET"
            git checkout -q FETCH_HEAD
            # Tag local pour le changelog ; la release le crée sur GitHub
            git tag "$TAG"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Version depuis le tag
        run: node scripts/version-from-tag.mjs
        env:
          GITHUB_REF_NAME: ${{ steps.tag.outputs.tag }}

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Décoder le keystore de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build Android (APK + AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Renommer les artefacts
        id: artifacts
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="android/app/build/outputs/bundle/release/app-release.aab"
          APK_OUT="komorebi-${TAG}.apk"
          AAB_OUT="komorebi-${TAG}.aab"
          cp "$APK_SRC" "$APK_OUT"
          cp "$AAB_SRC" "$AAB_OUT"
          sha256sum "$APK_OUT" > "${APK_OUT}.sha256"
          echo "apk=${APK_OUT}" >> "$GITHUB_OUTPUT"
          echo "aab=${AAB_OUT}" >> "$GITHUB_OUTPUT"
          echo "sha=${APK_OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Générer le changelog
        run: node scripts/changelog.mjs --to "${{ steps.tag.outputs.tag }}" --out CHANGELOG_BODY.md

      - name: Créer la publication GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.ref.outputs.sha }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: CHANGELOG_BODY.md
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.sha }}
            ${{ steps.artifacts.outputs.aab }}
